<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Space station</title>
  <desc id="desc">A modular orbital station with a central hub, ring, solar arrays, and docking pylons.</desc>
  <defs>
    <linearGradient id="station-body" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9f5ff"/>
      <stop offset="0.45" stop-color="#8fb3cc"/>
      <stop offset="1" stop-color="#39556e"/>
    </linearGradient>
    <linearGradient id="station-panel" x1="56" y1="176" x2="456" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36d2ff"/>
      <stop offset="1" stop-color="#6a5cff"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="48" fill="#07111f"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#16304d" stroke-width="18"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#203f5f" stroke-width="8" stroke-dasharray="22 18"/>
  <g filter="url(#soft-glow)" opacity="0.9">
    <path d="M92 256h328" fill="none" stroke="#35c7ff" stroke-width="12" stroke-linecap="round"/>
    <path d="M256 92v328" fill="none" stroke="#35c7ff" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g fill="url(#station-panel)">
    <path d="M30 220h118v72H30z"/>
    <path d="M364 220h118v72H364z"/>
    <path d="M220 30h72v118h-72z"/>
    <path d="M220 364h72v118h-72z"/>
  </g>
  <g fill="#12263b" stroke="#7edcff" stroke-width="8">
    <path d="M30 220h118v72H30z"/>
    <path d="M364 220h118v72H364z"/>
    <path d="M220 30h72v118h-72z"/>
    <path d="M220 364h72v118h-72z"/>
  </g>
  <g stroke="#7edcff" stroke-width="4" opacity="0.7">
    <path d="M62 220v72M94 220v72M126 220v72"/>
    <path d="M386 220v72M418 220v72M450 220v72"/>
    <path d="M220 62h72M220 94h72M220 126h72"/>
    <path d="M220 386h72M220 418h72M220 450h72"/>
  </g>
  <circle cx="256" cy="256" r="76" fill="url(#station-body)" stroke="#e5f7ff" stroke-width="10"/>
  <circle cx="256" cy="256" r="38" fill="#07111f" stroke="#7edcff" stroke-width="8"/>
  <circle cx="256" cy="256" r="12" fill="#f6fbff"/>
  <g fill="#d8edf8" stroke="#263d55" stroke-width="6">
    <rect x="236" y="140" width="40" height="68" rx="12"/>
    <rect x="236" y="304" width="40" height="68" rx="12"/>
    <rect x="140" y="236" width="68" height="40" rx="12"/>
    <rect x="304" y="236" width="68" height="40" rx="12"/>
  </g>
</svg>
