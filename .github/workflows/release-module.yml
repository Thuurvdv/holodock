name: Release Module

on:
  push:
    tags:
      - "holodock-v[0-9]*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Parse tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          MODULE_ID="${TAG%-v*}"
          VERSION="${TAG#*-v}"
          echo "module_id=$MODULE_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build module
        run: npm run build

      - name: Verify module id and version match
        run: |
          MODULE_ID="${{ steps.meta.outputs.module_id }}"
          TAG_VERSION="${{ steps.meta.outputs.version }}"
          JSON_ID=$(jq -r '.id' module.json)
          JSON_VERSION=$(jq -r '.version' module.json)
          if [ "$MODULE_ID" != "$JSON_ID" ]; then
            echo "::error::Tag module id ($MODULE_ID) does not match module.json id ($JSON_ID)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$JSON_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match module.json version ($JSON_VERSION)"
            exit 1
          fi

      - name: Package module
        run: |
          MODULE_ID="${{ steps.meta.outputs.module_id }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${{ github.repository }}"

          mkdir -p "staging/$MODULE_ID"

          MANIFEST_URL="https://github.com/$REPO/releases/latest/download/module.json"
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$MODULE_ID.zip"

          jq \
            --arg manifest "$MANIFEST_URL" \
            --arg download "$DOWNLOAD_URL" \
            '.manifest = $manifest | .download = $download' \
            module.json > "staging/$MODULE_ID/module.json"

          cp -r dist "staging/$MODULE_ID/dist"

          for dir in assets styles templates; do
            [ -d "$dir" ] && cp -r "$dir" "staging/$MODULE_ID/$dir"
          done

          for file in README.md LICENSE CHANGELOG.md; do
            [ -f "$file" ] && cp "$file" "staging/$MODULE_ID/$file"
          done

          cd staging
          zip -r "../$MODULE_ID.zip" "$MODULE_ID"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE_ID="${{ steps.meta.outputs.module_id }}"
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"

          gh release create "$TAG" "$MODULE_ID.zip" "staging/$MODULE_ID/module.json" \
            --title "$MODULE_ID v$VERSION" \
            --generate-notes
